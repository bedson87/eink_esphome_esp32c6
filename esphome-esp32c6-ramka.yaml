# =====================================================================
#  esp32-c6-1 - ramka e-ink (XIAO ESP32-C6 + Waveshare 7.5" V2)
#  Model: HA przygotowuje dane (sensor.e_ink_pogoda, sensor.e_ink_kalendarz),
#  ramka budzi się, zasysa gotowe atrybuty, rysuje i idzie spać.
# =====================================================================
substitutions:
  # --- sen ---
  night_start_h: "22"          # od tej godziny noc...
  night_end_h: "5"             # ...do tej godziny (budzenie o night_end_h:0X)
  wake_offset_min: "1"         # budź się X min po pełnej godzinie (HA odświeża dane o :00/:30)
  emergency_sleep_min: "30"    # sen, gdy HA nie odpowiada
  data_wait_timeout: 20s       # max czekanie na API + czas + helper
  epaper_wait: 10s             # czas na dokończenie odświeżania e-ink przed snem
  # --- ekran ---
  cal_lines_max: "8"           # musi pasować do ev[:8] po stronie HA
  mdi_font_url: https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf
  text_glyphs: " !\"#%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyzĄąĆćĘęŁłŃńÓóŚśŹźŻż—–…°"

esphome:
  name: esp32-c6-1
  friendly_name: esp32-c6-1
  on_boot:
    # Antena zewnętrzna - musi być przed startem WiFi
    - priority: 600
      then:
        - output.turn_off: gpio_rf_enable   # GPIO3 LOW  = włącz przełącznik RF
        - output.turn_on: gpio_ant_select   # GPIO14 HIGH = antena zewnętrzna
    # Główna logika po starcie systemu
    - priority: -10
      then:
        - script.execute: wake_cycle

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

api:
  encryption:
    key: XXXX

ota:
  - platform: esphome
    password: XXXX

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

debug:   # powód restartu (m.in. brownout) widoczny w logu i w HA

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  output_power: 20dB
  # Statyczny IP skraca każde wybudzenie o 1-2 s (brak DHCP) - odkomentuj i dopasuj:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 192.168.1.1

deep_sleep:
  id: deep_sleep_component

time:
  - platform: homeassistant     # czas przychodzi razem z API, bez zapytań NTP
    id: ha_time
    timezone: Europe/Warsaw

output:
  - platform: gpio
    pin: GPIO3
    id: gpio_rf_enable
  - platform: gpio
    pin: GPIO14
    id: gpio_ant_select

# ===========================================
#  LOGIKA CYKLU
# ===========================================
script:
  # Uśpienie do następnego "okna": pełna godzina + wake_offset_min,
  # w nocy do night_end_h:0X. Dzięki temu budzenia nie dryfują.
  - id: go_to_sleep
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: preventdeepsleep_set
          then:
            - logger.log:
                format: "Sen zablokowany przez helper w HA"
                level: WARN
          else:
            - deep_sleep.enter:
                id: deep_sleep_component
                sleep_duration: !lambda |-
                  auto t = id(ha_time).now();
                  if (!t.is_valid()) return (uint32_t) 3600000;
                  const int now_s = t.hour * 3600 + t.minute * 60 + t.second;
                  const int off = ${wake_offset_min} * 60;
                  int next_s;
                  if (t.hour >= ${night_start_h})      next_s = (24 + ${night_end_h}) * 3600 + off;
                  else if (t.hour < ${night_end_h})    next_s = ${night_end_h} * 3600 + off;
                  else                                 next_s = (t.hour + 1) * 3600 + off;
                  int diff = next_s - now_s;
                  if (diff <= 0) diff = 3600;
                  ESP_LOGW("sleep", "Sleeping %d s", diff);
                  return (uint32_t) diff * 1000UL;

  - id: wake_cycle
    mode: single
    then:
      # 1. Czekamy na to, co krytyczne: API, czas, helper
      - wait_until:
          condition:
            and:
              - api.connected:
              - lambda: 'return id(ha_time).now().is_valid() && id(preventdeepsleep_set).has_state();'
          timeout: ${data_wait_timeout}
      # reszta stanów z HA dociera tuż po połączeniu
      - delay: 1500ms
      # 2. Bateria (16 próbek w jednym update)
      - component.update: battery_voltage
      # 3. Brak danych z HA -> ekran awaryjny i krótki sen
      - if:
          condition:
            lambda: 'return !(id(ha_time).now().is_valid() && id(preventdeepsleep_set).has_state());'
          then:
            - logger.log:
                format: "Brak danych z HA - ekran awaryjny"
                level: ERROR
            - display.page.show: page_error
            - component.update: epaper
            - delay: ${epaper_wait}
            - deep_sleep.enter:
                id: deep_sleep_component
                sleep_duration: ${emergency_sleep_min}min
      # 4. Normalny ekran
      - if:
          condition:
            switch.is_on: test_mode_no_display
          then:
            - logger.log: "TEST MODE - pomijam odświeżenie ekranu"
          else:
            - display.page.show: page_main
            - component.update: epaper
            - delay: ${epaper_wait}
      # 5. Spać (chyba że helper w HA blokuje)
      - script.execute: go_to_sleep

# ===========================================
#  STEROWANIE
# ===========================================
switch:
  - platform: template
    name: "🧪 Tryb testowy (BEZ ekranu)"
    id: test_mode_no_display
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "🖼️ Ręczna aktualizacja ekranu"
    on_press:
      - display.page.show: page_main
      - component.update: epaper
  - platform: template
    name: "💤 Wymuś Deep Sleep 15min"
    on_press:
      - deep_sleep.enter:
          id: deep_sleep_component
          sleep_duration: 15min
  - platform: restart
    name: "🔄 Restart ESP"

binary_sensor:
  - platform: homeassistant
    id: preventdeepsleep_set
    entity_id: input_boolean.zapobiega_deepsleep_esp_ramka
    on_release:
      # Helper wyłączony PO zakończeniu cyklu (ramka czuwała) -> idź spać
      - if:
          condition:
            not:
              script.is_running: wake_cycle
          then:
            - script.execute: go_to_sleep

# ===========================================
#  SENSORY
# ===========================================
sensor:
  # --- bateria: dzielnik 1:1 na GPIO0 ---
  - platform: adc
    pin: GPIO0
    id: battery_voltage
    name: "Napięcie Baterii"
    attenuation: 12db
    samples: 16
    update_interval: never
    accuracy_decimals: 2
    filters:
      - multiply: 2.0

  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Poziom Baterii"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.30 -> 0.0
            - 3.50 -> 10.0
            - 3.70 -> 40.0
            - 3.90 -> 75.0
            - 4.10 -> 100.0
      - clamp:
          min_value: 0
          max_value: 100

  # --- pogoda: atrybuty sensor.e_ink_pogoda (liczy HA) ---
  - platform: homeassistant
    id: w_temp
    entity_id: sensor.e_ink_pogoda
    attribute: temperature
  - platform: homeassistant
    id: w_feels
    entity_id: sensor.e_ink_pogoda
    attribute: feels_like
  - platform: homeassistant
    id: w_humidity
    entity_id: sensor.e_ink_pogoda
    attribute: humidity
  - platform: homeassistant
    id: w_pressure
    entity_id: sensor.e_ink_pogoda
    attribute: pressure
  - platform: homeassistant
    id: w_wind
    entity_id: sensor.e_ink_pogoda
    attribute: wind_speed
  - platform: homeassistant
    id: w_precip
    entity_id: sensor.e_ink_pogoda
    attribute: precip_2h

text_sensor:
  - platform: debug
    reset_reason:
      name: "Powód restartu"

  - platform: homeassistant
    id: weather_state
    entity_id: sensor.e_ink_pogoda
    attribute: condition
  - platform: homeassistant
    id: air_quality
    entity_id: sensor.e_ink_pogoda
    attribute: smog
  # prognoza: "HH:00|condition|temp"
  - platform: homeassistant
    id: fc_1
    entity_id: sensor.e_ink_pogoda
    attribute: forecast_1
  - platform: homeassistant
    id: fc_2
    entity_id: sensor.e_ink_pogoda
    attribute: forecast_2
  - platform: homeassistant
    id: fc_3
    entity_id: sensor.e_ink_pogoda
    attribute: forecast_3
  # kalendarz: do 8 linii rozdzielonych \n
  - platform: homeassistant
    id: cal_lines
    entity_id: sensor.e_ink_kalendarz
    attribute: lines

# ===========================================
#  SPI + WYŚWIETLACZ
# ===========================================
spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO20

font:
  - file: "gfonts://Roboto@700"
    id: f_big
    size: 60
    glyphs: '0123456789.°C -'
  - file: "gfonts://Roboto@700"
    id: f_header
    size: 33
    glyphs: ' .:0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZĄĆĘŁŃÓŚŹŻ—–'
  - file: "gfonts://Roboto@400"
    id: f_normal
    size: 26
    glyphs: ${text_glyphs}
  - file: "gfonts://Roboto@400"
    id: f_small
    size: 20
    glyphs: ${text_glyphs}
  - file: "gfonts://Roboto@700"
    id: f_small_bold
    size: 20
    glyphs: ${text_glyphs}

  # MDI - ikony pogody (duże) + alert; ta sama lista używana przez mdi_small
  - file: ${mdi_font_url}
    id: mdi_large
    size: 120
    glyphs: &mdi_weather
      - "\U000F0599"  # sunny
      - "\U000F0594"  # night
      - "\U000F0590"  # cloudy
      - "\U000F0595"  # partly-cloudy
      - "\U000F0597"  # rainy
      - "\U000F0596"  # pouring
      - "\U000F0593"  # lightning
      - "\U000F067E"  # lightning-rainy
      - "\U000F0598"  # snowy
      - "\U000F067F"  # snowy-rainy
      - "\U000F0591"  # fog
      - "\U000F0592"  # hail
      - "\U000F059E"  # windy
      - "\U000F1BE0"  # alert - brak danych
      - "\U000F05D6"  # alert-circle-outline
  - file: ${mdi_font_url}
    id: mdi_small
    size: 60
    glyphs: *mdi_weather
  - file: ${mdi_font_url}
    id: mdi_micro
    size: 24
    glyphs:
      - "\U000F058E"  # water-percent
      - "\U000F029A"  # gauge
      - "\U000F054B"  # umbrella
      - "\U000F059E"  # windy
      - "\U000F0082"  # battery-90
      - "\U000F007E"  # battery-50
      - "\U000F007A"  # battery-low
      - "\U000F10CD"  # battery-critical
      - "\U000F0BC8"  # smog niski
      - "\U000F0BC7"  # smog wysoki
      - "\U000F10C3"  # thermometer-low (odczuwalna)
  - file: ${mdi_font_url}
    id: mdi_medium
    size: 45
    glyphs:
      - "\U000F07D0"  # home-assistant

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inV2p
    cs_pin: GPIO21
    dc_pin: GPIO22
    reset_pin: GPIO23
    busy_pin:
      number: GPIO2
      inverted: true
    full_update_every: 30    # po deep sleep i tak każdy refresh jest pełny
    reset_duration: 2ms
    update_interval: never
    rotation: 90             # pionowo 480x800
    pages:
      # ---------------------------------------------------------------
      - id: page_main
        lambda: |-
          const int W = 480;
          const int H = 800;
          const int PAD = 15;
          const int METRICS_X = 205;
          const int FORECAST_HEIGHT = 120;
          const int CAL_LINE = 24;

          auto ok = [](float v) { return !std::isnan(v); };

          auto get_icon = [](const std::string &c) -> const char * {
            if (c == "sunny" || c == "clear-day") return "\U000F0599";
            if (c == "clear-night") return "\U000F0594";
            if (c == "partlycloudy" || c == "partly-cloudy-day" || c == "partly-cloudy-night") return "\U000F0595";
            if (c == "cloudy") return "\U000F0590";
            if (c == "fog" || c == "hazy") return "\U000F0591";
            if (c == "rainy") return "\U000F0597";
            if (c == "pouring") return "\U000F0596";
            if (c == "lightning") return "\U000F0593";
            if (c == "lightning-rainy" || c == "thunderstorm") return "\U000F067E";
            if (c == "snowy") return "\U000F0598";
            if (c == "snowy-rainy") return "\U000F067F";
            if (c == "hail") return "\U000F0592";
            if (c == "windy" || c == "windy-variant") return "\U000F059E";
            return "\U000F1BE0";   // exceptional / unknown / unavailable
          };

          // slot prognozy: "HH:00|condition|temp"
          auto draw_slot = [&](int x, int yy, const std::string &s) {
            size_t p1 = s.find('|');
            size_t p2 = (p1 == std::string::npos) ? p1 : s.find('|', p1 + 1);
            if (p2 == std::string::npos) return;
            std::string label = s.substr(0, p1);
            std::string cond = s.substr(p1 + 1, p2 - p1 - 1);
            it.printf(x, yy, id(f_normal), COLOR_ON, TextAlign::TOP_CENTER, "%s", label.c_str());
            it.printf(x, yy + 55, id(mdi_small), COLOR_ON, TextAlign::CENTER, "%s", get_icon(cond));
            if (cond == "unknown") {
              it.print(x, yy + 85, id(f_normal), COLOR_ON, TextAlign::TOP_CENTER, "--");
            } else {
              it.printf(x, yy + 85, id(f_normal), COLOR_ON, TextAlign::TOP_CENTER, "%.0f°C", atof(s.c_str() + p2 + 1));
            }
          };

          auto t = id(ha_time).now();
          const char *dni[] = {"NIEDZIELA", "PONIEDZIAŁEK", "WTOREK", "ŚRODA", "CZWARTEK", "PIĄTEK", "SOBOTA"};
          int dow = (t.day_of_week >= 1 && t.day_of_week <= 7) ? t.day_of_week - 1 : 0;
          int y = PAD;

          // ===== NAGŁÓWEK =====
          it.printf(PAD - 5, y - 5, id(mdi_medium), COLOR_ON, "\U000F07D0");
          it.printf(W / 2 + 15, y, id(f_header), COLOR_ON, TextAlign::TOP_CENTER, "%02d.%02d.%04d %s",
                    t.day_of_month, t.month, t.year, dni[dow]);
          y += 45;
          it.line(PAD, y, W - PAD, y);
          y += 15;

          // ===== POGODA BIEŻĄCA =====
          int main_y = y;
          if (id(weather_state).has_state()) {
            it.printf(95, main_y + 70, id(mdi_large), COLOR_ON, TextAlign::CENTER, "%s", get_icon(id(weather_state).state));
          }
          if (ok(id(w_temp).state)) {
            it.printf(95, main_y + 160, id(f_big), COLOR_ON, TextAlign::CENTER, "%.0f°C", id(w_temp).state);
          }

          int my = main_y + 18;
          char buf[48];
          auto metric = [&](const char *icon, const char *text) {
            it.printf(METRICS_X, my + 3, id(mdi_micro), COLOR_ON, "%s", icon);
            it.printf(METRICS_X + 28, my, id(f_normal), COLOR_ON, "%s", text);
            my += 28;
          };
          if (ok(id(w_feels).state)) {
            snprintf(buf, sizeof(buf), "Odczuwalna: %.0f°C", id(w_feels).state);
            metric("\U000F10C3", buf);
          }
          if (ok(id(w_precip).state)) {
            snprintf(buf, sizeof(buf), "Opady (2h): %.1f mm", id(w_precip).state);
            metric("\U000F054B", buf);
          }
          if (ok(id(w_humidity).state)) {
            snprintf(buf, sizeof(buf), "Wilgotność: %.0f%%", id(w_humidity).state);
            metric("\U000F058E", buf);
          }
          if (ok(id(w_pressure).state)) {
            snprintf(buf, sizeof(buf), "Ciśnienie: %.0f hPa", id(w_pressure).state);
            metric("\U000F029A", buf);
          }
          if (ok(id(w_wind).state)) {
            snprintf(buf, sizeof(buf), "Wiatr: %.1f km/h", id(w_wind).state);
            metric("\U000F059E", buf);
          }
          if (id(air_quality).has_state()) {
            const std::string &s = id(air_quality).state;
            if (!s.empty() && s != "unavailable" && s != "unknown" && s != "None") {
              bool low = (s == "niski" || s == "bardzo niski" || s == "średni");
              snprintf(buf, sizeof(buf), "Smog: %s", s.c_str());
              metric(low ? "\U000F0BC8" : "\U000F0BC7", buf);
            }
          }

          y = main_y + 220;
          it.line(PAD, y, W - PAD, y);
          y += 15;

          // ===== PROGNOZA (+2h / +4h / +6h) =====
          const int col = W / 3;
          if (id(fc_1).has_state()) draw_slot(col / 2, y, id(fc_1).state);
          if (id(fc_2).has_state()) draw_slot(W / 2, y, id(fc_2).state);
          if (id(fc_3).has_state()) draw_slot(W - col / 2, y, id(fc_3).state);

          y += FORECAST_HEIGHT + 5;
          it.line(PAD, y, W - PAD, y);
          y += 15;

          // ===== KALENDARZ =====
          it.print(PAD, y, id(f_header), COLOR_ON, "KALENDARZ:");
          y += 45;
          if (id(cal_lines).has_state()) {
            const std::string &all = id(cal_lines).state;
            size_t pos = 0;
            for (int n = 0; n < ${cal_lines_max} && pos <= all.size(); n++) {
              size_t nl = all.find('\n', pos);
              std::string line = all.substr(pos, nl == std::string::npos ? std::string::npos : nl - pos);
              if (!line.empty()) {
                bool today = line.rfind("Dziś", 0) == 0;
                auto font = today ? id(f_small_bold) : id(f_small);
                it.print(PAD, y, font, COLOR_ON, line.c_str());
              }
              y += CAL_LINE;
              if (nl == std::string::npos) break;
              pos = nl + 1;
            }
          }

          // ===== STOPKA =====
          it.line(PAD, H - 35, W - PAD, H - 35);
          it.printf(PAD, H - 7, id(f_small), COLOR_ON, TextAlign::BOTTOM_LEFT, "Aktualizacja: %02d.%02d.%04d %02d:%02d",
                    t.day_of_month, t.month, t.year, t.hour, t.minute);
          float bat = id(battery_level).state;
          if (ok(bat)) {
            const char *icon = bat <= 5 ? "\U000F10CD" : bat <= 25 ? "\U000F007A" : bat <= 60 ? "\U000F007E" : "\U000F0082";
            it.printf(W - PAD, H - 7, id(mdi_micro), COLOR_ON, TextAlign::BOTTOM_RIGHT, "%s", icon);
            it.printf(W - PAD - 30, H - 7, id(f_small), COLOR_ON, TextAlign::BOTTOM_RIGHT, "%.0f%%", bat);
          }

      # ---------------------------------------------------------------
      - id: page_error
        lambda: |-
          const int W = 480;
          const int H = 800;
          it.printf(W / 2, H / 2 - 100, id(mdi_large), COLOR_ON, TextAlign::CENTER, "\U000F05D6");
          it.print(W / 2, H / 2 + 60, id(f_header), COLOR_ON, TextAlign::CENTER, "BRAK POŁĄCZENIA");
          it.print(W / 2, H / 2 + 120, id(f_normal), COLOR_ON, TextAlign::CENTER, "Ponowna próba za ${emergency_sleep_min} min");
          auto t = id(ha_time).now();
          if (t.is_valid()) {
            it.printf(W / 2, H - 50, id(f_small), COLOR_ON, TextAlign::CENTER, "Ostatnia próba: %02d:%02d", t.hour, t.minute);
          } else {
            it.print(W / 2, H - 50, id(f_small), COLOR_ON, TextAlign::CENTER, "Brak synchronizacji czasu");
          }
